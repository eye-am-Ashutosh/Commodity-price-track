name: Update prices

on:
  schedule:
    - cron: "0 5 * * 1-5"   # 05:00 UTC = 10:30 IST, Monday–Friday
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the latest prices
        run: python3 scripts/update_prices.py

      - name: Save data.json
        run: |
          if git diff --quiet -- data.json; then
            echo "No new prices."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Prices from Trading Economics ($(date -u '+%F %H:%M') UTC)"
          git push
